name: ETL + Deploy OLAP dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC: refresh data and redeploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Extract, transform, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract (USGS API) + Transform (DuckDB) + Load (Parquet)
        run: python etl/pipeline.py --days 730 --min-mag 2.5

      - name: Data quality checks
        run: python etl/validate.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
